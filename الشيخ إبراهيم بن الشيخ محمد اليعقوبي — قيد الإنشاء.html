<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الشيخ إبراهيم بن الشيخ محمد اليعقوبي — قيد الإنشاء</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcfaf5;--ink:#2a2a2a;--mute:#76716a;--gold:#b08d3c;--green:#3ca554;--green2:#2f8f45;--line:#e6dfd0;
--serif:'Amiri','Traditional Arabic',serif;--sans:'Tajawal','Segoe UI',Tahoma,sans-serif;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fcfaf5;--ink:#2a2a2a}}
:root[data-theme="dark"]{--bg:#fcfaf5;--ink:#2a2a2a}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--bg);color:var(--ink);font:400 18px/1.9 var(--sans);
background-image:linear-gradient(45deg,rgba(176,141,60,.07) 25%,transparent 25%,transparent 75%,rgba(176,141,60,.07) 75%),linear-gradient(-45deg,rgba(176,141,60,.07) 25%,transparent 25%,transparent 75%,rgba(176,141,60,.07) 75%);background-size:46px 46px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.top div{max-width:1120px;margin:auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between}
.top a.home{padding:11px 0;font-weight:500;font-size:16px;color:var(--gold)}
.top a.tg{display:grid;place-items:center;width:34px;height:34px;color:var(--green)}
.top svg{width:22px;height:22px;fill:currentColor}
.hero{height:clamp(300px,56vw,540px);background:#000;border-bottom:7px solid var(--gold);border-radius:0 0 50% 50%/0 0 clamp(40px,8vw,90px) clamp(40px,8vw,90px);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;display:block}
main{max-width:1000px;margin:0 auto;padding:0 20px 56px;text-align:center}
h1{font:700 clamp(26px,5vw,42px)/1.6 var(--serif);margin:34px 0 4px}
.sub{font:400 clamp(19px,3.4vw,26px)/1.8 var(--serif);color:var(--mute);margin:0}
.pills{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:36px 0 10px}
.pill{display:inline-flex;align-items:center;gap:12px;border-radius:14px;padding:8px 22px;font-weight:500;font-size:17px;background:#fff}
.pill.g{border:2px solid var(--green);color:var(--green2)}
.pill.y{border:2px solid var(--gold);color:#8a6c25;padding-inline-start:10px}
.dots{display:inline-flex;gap:5px}.dots span{width:7px;height:7px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite both}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.ic{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;font-size:18px;line-height:1}
.card{margin:30px auto 0;max-width:720px;background:#fff;border-radius:28px;padding:22px 24px 26px;box-shadow:0 6px 24px rgba(0,0,0,.09);text-align:start}
.card h2{margin:0 0 14px;font:700 24px/1.5 var(--serif);color:var(--gold)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--green);color:#fff;border-radius:10px;padding:16px 20px;font-weight:700;font-size:18px;line-height:1.7;transition:.2s}
.bar:hover{background:var(--green2);transform:translateY(-2px)}
.bar .ic{background:#fff;color:var(--green);flex:none;width:38px;height:38px}
@media (prefers-reduced-motion:reduce){.dots span{animation:none;opacity:1}.bar{transition:none}}
</style>
</head>
